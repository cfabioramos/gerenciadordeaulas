# Nginx Reverse Proxy Configuration (Optional - for Production)
# Use este arquivo como exemplo para colocar a aplicação atrás de um reverse proxy

upstream gerenciadordeaulas {
    server app:8080;
}

server {
    listen 80;
    server_name localhost;

    # Redirect HTTP to HTTPS (uncomment for HTTPS)
    # return 301 https://$server_name$request_uri;

    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/gerenciadordeaulas_access.log;
    error_log /var/log/nginx/gerenciadordeaulas_error.log;

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://gerenciadordeaulas;
    }

    # Main API
    location / {
        proxy_pass http://gerenciadordeaulas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket support (if needed)
    location /ws {
        proxy_pass http://gerenciadordeaulas;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

