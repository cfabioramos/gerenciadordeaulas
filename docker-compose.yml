services:
  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gerenciadordeaulas-app
    environment:
      # Server Configuration
      SERVER_PORT: "${SERVER_PORT:-8080}"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-docker}"
      SPRING_APPLICATION_NAME: "${SPRING_APPLICATION_NAME:-EscolaGerenciamentoDeAulas}"

      # Database Configuration
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.postgresql.Driver}"

      # JPA/Hibernate Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: "${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}"
      SPRING_JPA_SHOW_SQL: "${SPRING_JPA_SHOW_SQL:-false}"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:-false}"
      SPRING_JPA_DATABASE_PLATFORM: "${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.PostgreSQLDialect}"

      # Connection Pool
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-5}"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-20}"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:-3000}"
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-600000}"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:-1800000}"

      # Java Options
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - ./.mvn:/app/.mvn
      - maven_cache:/root/.m2
    networks:
      - gerenciadordeaulas-network
    restart: unless-stopped
    labels:
      - "com.gerenciadordeaulas.description=Gerenciador de Aulas API"
      - "com.gerenciadordeaulas.version=0.0.1"

volumes:
  maven_cache:
    driver: local

networks:
  gerenciadordeaulas-network:
    driver: bridge
