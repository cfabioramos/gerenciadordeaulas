services:
  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gerenciadordeaulas-app
    environment:
      # Server Configuration
      SERVER_PORT: ${APP_PORT:-8080}
      SPRING_APPLICATION_NAME: "EscolaGerenciamentoDeAulas"
      
      # Database Configuration
      SPRING_DATASOURCE_URL: "jdbc:postgresql://ep-cold-pine-axkrxua6.c-4.us-east-2.aws.neon.tech:5432/neondb?sslmode=require"
      SPRING_DATASOURCE_USERNAME: "neondb_owner"
      SPRING_DATASOURCE_PASSWORD: "npg_SvBapD0Ah6Rw"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      # SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      # SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres123}

      # JPA/Hibernate Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: ${JPA_FORMAT_SQL:-false}
      SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.PostgreSQLDialect"
      
      # Connection Pool
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "20"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "600000"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "1800000"

      # Java Options
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - ./.mvn:/app/.mvn
      - maven_cache:/root/.m2
    networks:
      - gerenciadordeaulas-network
    restart: unless-stopped
    labels:
      - "com.gerenciadordeaulas.description=Gerenciador de Aulas API"
      - "com.gerenciadordeaulas.version=0.0.1"

volumes:
  maven_cache:
    driver: local

networks:
  gerenciadordeaulas-network:
    driver: bridge
