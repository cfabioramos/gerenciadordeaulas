services:
  # Spring Boot Application - Production
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gerenciadordeaulas:latest
    container_name: gerenciadordeaulas-app-prod
    environment:
      SERVER_PORT: ${SERVER_PORT:-10000}
      SPRING_APPLICATION_NAME: "EscolaGerenciamentoDeAulas"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://ep-cold-pine-axkrxua6.c-4.us-east-2.aws.neon.tech:5432/neondb?sslmode=require"
      SPRING_DATASOURCE_USERNAME: "neondb_owner"
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-validate}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.PostgreSQLDialect"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "20"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "600000"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "1800000"
      JAVA_OPTS: "-Xmx1024m -Xms512m -XX:+UseG1GC -XX:+ParallelRefProcEnabled"
    ports:
      - "${APP_PORT:-10000}:10000"
    networks:
      - gerenciadordeaulas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.gerenciadordeaulas.description=Gerenciador de Aulas API"
      - "com.gerenciadordeaulas.version=0.0.1"

networks:
  gerenciadordeaulas-network:
    driver: bridge
